# SPDX-License-Identifier: MPL-2.0
#
# Cerro Torre manifest for odraz .ctp bundle
#
# This manifest describes the container image for verified
# container packaging. Used by `ct pack` to create .ctp bundles.

[metadata]
name = "odraz"
version = "0.1.0"
revision = 1
summary = "Dialectic Programming Language for the Industrial Workstations of the World (the pun, not the semantics): a unityped, homoiconic, reflexive language with no typechecker, where a Judgement Evidence Graph records what is believed about each term and why. Pre-alpha; Chapel bootstrap."
description = """
odraz — containerised service packaged as a verified
cerro-torre .ctp bundle with Ed25519 signing and full provenance
tracking.
"""
license = "{{LICENSE}}"
homepage = "https://github.com/metadatastician/odraz"
maintainer = "{{AUTHOR}} <{{EMAIL}}>"

[provenance]
upstream = "https://github.com/metadatastician/odraz"
import_date = 2026-11-27T00:00:00Z

[dependencies]
runtime = ["ca-certificates", "curl"]
build = []

[build]
system = "podman"

[build.environment]
APP_HOST = "[::]"
APP_PORT = "{{PORT}}"

[outputs]
primary = "odraz"
split = []

[attestations]
require = ["source-signature", "sbom-complete"]
recommend = ["security-audit", "reproducible-build"]

# Runtime security profile
[security]
user = "appuser"
group = "appuser"
read_only_root = false
no_new_privileges = true

[security.capabilities]
drop = ["ALL"]
add = ["NET_BIND_SERVICE"]

[security.network]
listen_tcp = [{{PORT}}]

[security.filesystem]
read = ["/app/", "/data/"]
write = ["/data/", "/tmp/"]
execute = ["/app/entrypoint.sh"]
